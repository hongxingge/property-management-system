spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/management_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.example.manage.mapper: debug
    com.alipay.api: WARN
    sdk: WARN

file-save-path: ${FILE_SAVE_PATH}

alipay:
  app-id: ${ALIPAY_APP_ID}
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY}
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  charset: UTF-8
  sign-type: RSA2
  return-url: ${ALIPAY_RETURN_URL}
  notify-url: ${ALIPAY_NOTIFY_URL}
  front-url: ${FRONT_URL}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat

  siliconflow:
    api-key: ${SILICONFLOW_API_KEY}
    base-url: https://api.siliconflow.cn/v1
    embedding-model: BAAI/bge-m3

  top-k: ${RAG_TOP_K:3}