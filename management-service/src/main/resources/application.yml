spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/management_db?useUnicode=true&characterEncoding=utf8
    username: root
    password: 1018
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.manage.bean
  mapper-locations: classpath:mapper/*Mapper.xml

server:
  servlet:
    context-path: /management
  port: 8899


# 打印sqlcom.example.manage.bean
logging:
  level:
    com.example.manage.mapper: debug
    com.alipay.api: WARN   # 屏蔽支付宝 SDK 业务失败的 ERROR 日志(交易不存在等属正常)
    sdk: WARN              # SDK 内部 biz.err logger

# file-save-path: C:/user_images
file-save-path: C:/user_images/

# 支付宝沙箱配置
alipay:
  app-id: 9021000167670248
  app-private-key: 
  alipay-public-key:     # ← 上传应用公钥后平台回显的那串,拿到再填
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  charset: UTF-8
  sign-type: RSA2
  # 同步返回:付款后浏览器跳回这个后端接口(浏览器访问 localhost 没问题)
  return-url: http://localhost:8899/management/payCost/return
  # 异步通知:支付宝服务器POST过来,必须公网可达(本地需内网穿透,演示阶段先用 return 兜底)
  notify-url: http://localhost:8899/management/payCost/notify
  front-url: http://localhost:8080    # 前端地址,同步返回后重定向到这里