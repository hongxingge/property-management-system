spring:
  application:
    name: property-management-system

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.manage.bean
  mapper-locations: classpath:mapper/*Mapper.xml

server:
  servlet:
    context-path: /management
  port: 8899